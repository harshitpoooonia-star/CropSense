{% extends "base.html" %}
{% block title %}{{ _("Log in") }} · {{ _("AgriSense") }}{% endblock %}
{% block content %}
  <h1>{{ _("Log in") }}</h1>
  {% include "profile/_error.html" %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="phone">{{ _("Mobile number") }}</label>
    <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required>

    <label for="pin">{{ _("PIN") }}</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" required>

    <button type="submit">{{ _("Log in") }}</button>
  </form>
  <p>{{ _("Forgot your PIN? Ask your KVK or FPO helper for a reset code.") }}</p>
  <p><a href="{{ url_for('profile.pin_reset') }}">{{ _("I have a reset code") }}</a></p>
{% endblock %}
