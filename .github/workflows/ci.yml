name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway container that only lives for this job; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agrisense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_URL: postgresql://postgres@localhost:5432/agrisense_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Committed CSS matches the Tailwind source
        run: python scripts/build_css.py --check

      - name: Unit tests (SQLite)
        run: pytest -q

      - name: Unit tests (Postgres)
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: pytest -q --ignore=tests/test_migrations.py

      - name: Migrations on Postgres (upgrade, models match, downgrade)
        env:
          AGRISENSE_ENV: development
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db check
          flask --app wsgi db downgrade base

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Browser smoke test (guest routes at 360 px)
        run: python scripts/run_e2e.py
